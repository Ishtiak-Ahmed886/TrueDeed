<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%" style="background:#0f172a; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="20" width="920" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="480" y="50" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="700">2.1 Chain of Ownership Verification — Directed Acyclic Graph (DAG)</text>
  <text x="480" y="72" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Module 2: Historical Deed Lineage Validation & Broken Chain Detection</text>
  <line x1="480" y1="220" x2="480" y2="240" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="412.5" y="212.0" width="135" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="480.0" y="225.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Construct Nodes</text>
  <line x1="480" y1="360" x2="480" y2="380" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="390.0" y="352.0" width="180" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="480.0" y="365.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Run Invariant Checks</text>
  <line x1="260" y1="510" x2="260" y2="530" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="188.0" y="502.0" width="144" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="260.0" y="515.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Invariant Failed</text>
  <line x1="700" y1="510" x2="700" y2="530" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="605.5" y="502.0" width="189" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="700.0" y="515.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">All Invariants Passed</text>
  <!-- Node: 1. BAYA DEED METADATA EXTRACTION LAYER -->
  <g filter="url(#shadow)">
    <rect x="60" y="110" width="840" height="110" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="2" />
    <path d="M 60 138 L 900 138" stroke="#0d9488" stroke-width="1.5" />
    <text x="480.0" y="129" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="700">1. BAYA DEED METADATA EXTRACTION LAYER</text>
    <text x="74" y="158" fill="#e2e8f0" font-size="11.5" font-weight="500">• Historical Deed Parser extracts: CS Khatian, SA Khatian, RS Khatian, Baya Deeds</text>
    <text x="74" y="178" fill="#e2e8f0" font-size="11.5" font-weight="500">• Identifies Sequential Nodes: (Deed Number, Year, Sub-Registry Office, Seller, Buyer, Area)</text>
    <text x="74" y="198" fill="#e2e8f0" font-size="11.5" font-weight="500">• Formulates Sequential Directed Graph: Node(0) -> Node(1) -> Node(2) -> Current Deed</text>
  </g>
  <!-- Node: 2. GRAPH INVARIANT VALIDATION CORE (DAG ENGINE) -->
  <g filter="url(#shadow)">
    <rect x="60" y="240" width="840" height="120" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <path d="M 60 268 L 900 268" stroke="#0284c7" stroke-width="1.5" />
    <text x="480.0" y="259" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="700">2. GRAPH INVARIANT VALIDATION CORE (DAG ENGINE)</text>
    <text x="74" y="288" fill="#e2e8f0" font-size="11.5" font-weight="500">• Invariant 1 (Temporal Consistency): Execution_Date(N+1) > Execution_Date(N)</text>
    <text x="74" y="308" fill="#e2e8f0" font-size="11.5" font-weight="500">• Invariant 2 (Party Continuity): Buyer(Node N) MUST MATCH Seller(Node N+1)</text>
    <text x="74" y="328" fill="#e2e8f0" font-size="11.5" font-weight="500">• Invariant 3 (Area Conservation): Transferred_Area(N+1) <= Acquired_Area(Node N)</text>
  </g>
  <!-- Node: 3. SUB-REGISTRY RECORD RECONCILIATION ENGINE -->
  <g filter="url(#shadow)">
    <rect x="60" y="380" width="840" height="130" rx="8" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <path d="M 60 408 L 900 408" stroke="#9333ea" stroke-width="1.5" />
    <text x="480.0" y="399" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="700">3. SUB-REGISTRY RECORD RECONCILIATION ENGINE</text>
    <text x="74" y="428" fill="#e2e8f0" font-size="11.5" font-weight="500">• Historical Cross-Check: Verifies intermediate Baya deed references against district archive logs</text>
    <text x="74" y="448" fill="#e2e8f0" font-size="11.5" font-weight="500">• Identifies Broken Links: Detects fictitious sub-registry book volumes and counterfeit transfers</text>
    <text x="74" y="468" fill="#e2e8f0" font-size="11.5" font-weight="500">• Generates Lineage Proof: Formulates a continuous cryptographic pedigree of ownership</text>
  </g>
  <!-- Node: 4A. BROKEN CHAIN / FRAUD DETECTED -->
  <g filter="url(#shadow)">
    <rect x="60" y="530" width="400" height="190" rx="8" fill="#7f1d1d" stroke="#dc2626" stroke-width="2" />
    <path d="M 60 558 L 460 558" stroke="#dc2626" stroke-width="1.5" />
    <text x="260.0" y="549" text-anchor="middle" fill="#fee2e2" font-size="13" font-weight="700">4A. BROKEN CHAIN / FRAUD DETECTED</text>
    <text x="74" y="578" fill="#e2e8f0" font-size="11.5" font-weight="500">• Status: 🔴 BROKEN_LINEAGE_ALERT</text>
    <text x="74" y="598" fill="#e2e8f0" font-size="11.5" font-weight="500">• Finding: Intermediate deed party mismatch!</text>
    <text x="74" y="618" fill="#e2e8f0" font-size="11.5" font-weight="500">• Impact: Title invalid; transaction rejected</text>
    <text x="74" y="638" fill="#e2e8f0" font-size="11.5" font-weight="500">• Penalty: -35 Points from Trust Score</text>
  </g>
  <!-- Node: 4B. VERIFIED UNBROKEN CHAIN -->
  <g filter="url(#shadow)">
    <rect x="500" y="530" width="400" height="190" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="2" />
    <path d="M 500 558 L 900 558" stroke="#16a34a" stroke-width="1.5" />
    <text x="700.0" y="549" text-anchor="middle" fill="#dcfce7" font-size="13" font-weight="700">4B. VERIFIED UNBROKEN CHAIN</text>
    <text x="514" y="578" fill="#e2e8f0" font-size="11.5" font-weight="500">• Status: 🟢 UNBROKEN_CHAIN_VERIFIED</text>
    <text x="514" y="598" fill="#e2e8f0" font-size="11.5" font-weight="500">• Finding: 100% continuous lineage to CS/SA</text>
    <text x="514" y="618" fill="#e2e8f0" font-size="11.5" font-weight="500">• Impact: Clean market title ready for conveyance</text>
    <text x="514" y="638" fill="#e2e8f0" font-size="11.5" font-weight="500">• Reward: +35 Points to Trust Score</text>
  </g>
</svg>