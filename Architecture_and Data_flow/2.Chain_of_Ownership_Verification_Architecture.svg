<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" style="background:#0f172a; font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="20" width="920" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="480" y="50" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">2.1 Chain of Ownership Verification - Directed Acyclic Graph (DAG)</text>
  <text x="480" y="72" text-anchor="middle" fill="#94a3b8" font-size="12">Module 2: Historical Deed Lineage Validation and Broken Chain Detection</text>
  <line x1="480" y1="220" x2="480" y2="240" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="412.5" y="212.0" width="135" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="480.0" y="226.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Construct Nodes</text>
  <line x1="480" y1="360" x2="480" y2="380" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="390.0" y="352.0" width="180" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="480.0" y="366.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Run Invariant Checks</text>
  <line x1="260" y1="510" x2="260" y2="530" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="188.0" y="502.0" width="144" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="260.0" y="516.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Invariant Failed</text>
  <line x1="700" y1="510" x2="700" y2="530" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="605.5" y="502.0" width="189" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="700.0" y="516.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">All Invariants Passed</text>
  <!-- Node: 1. BAYA DEED METADATA EXTRACTION LAYER -->
  <g>
    <rect x="60" y="110" width="840" height="110" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="2" />
    <path d="M 60 140 L 900 140" stroke="#0d9488" stroke-width="1.5" />
    <text x="480.0" y="130" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="bold">1. BAYA DEED METADATA EXTRACTION LAYER</text>
    <text x="74" y="160" fill="#e2e8f0" font-size="11.5">• Historical Deed Parser extracts: CS Khatian, SA Khatian, RS Khatian, Baya Deeds</text>
    <text x="74" y="180" fill="#e2e8f0" font-size="11.5">• Identifies Sequential Nodes: (Deed Number, Year, Sub-Registry Office, Seller, Buyer, Area)</text>
    <text x="74" y="200" fill="#e2e8f0" font-size="11.5">• Formulates Sequential Directed Graph: Node(0) -&gt; Node(1) -&gt; Node(2) -&gt; Current Deed</text>
  </g>
  <!-- Node: 2. GRAPH INVARIANT VALIDATION CORE (DAG ENGINE) -->
  <g>
    <rect x="60" y="240" width="840" height="120" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <path d="M 60 270 L 900 270" stroke="#0284c7" stroke-width="1.5" />
    <text x="480.0" y="260" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="bold">2. GRAPH INVARIANT VALIDATION CORE (DAG ENGINE)</text>
    <text x="74" y="290" fill="#e2e8f0" font-size="11.5">• Invariant 1 (Temporal Consistency): Execution_Date(N+1) &gt; Execution_Date(N)</text>
    <text x="74" y="310" fill="#e2e8f0" font-size="11.5">• Invariant 2 (Party Continuity): Buyer(Node N) MUST MATCH Seller(Node N+1)</text>
    <text x="74" y="330" fill="#e2e8f0" font-size="11.5">• Invariant 3 (Area Conservation): Transferred_Area(N+1) &lt;= Acquired_Area(Node N)</text>
  </g>
  <!-- Node: 3. SUB-REGISTRY RECORD RECONCILIATION ENGINE -->
  <g>
    <rect x="60" y="380" width="840" height="130" rx="8" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <path d="M 60 410 L 900 410" stroke="#9333ea" stroke-width="1.5" />
    <text x="480.0" y="400" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="bold">3. SUB-REGISTRY RECORD RECONCILIATION ENGINE</text>
    <text x="74" y="430" fill="#e2e8f0" font-size="11.5">• Historical Cross-Check: Verifies intermediate Baya deed references against district archive logs</text>
    <text x="74" y="450" fill="#e2e8f0" font-size="11.5">• Identifies Broken Links: Detects fictitious sub-registry book volumes and counterfeit transfers</text>
    <text x="74" y="470" fill="#e2e8f0" font-size="11.5">• Generates Lineage Proof: Formulates a continuous cryptographic pedigree of ownership</text>
  </g>
  <!-- Node: 4A. BROKEN CHAIN / FRAUD DETECTED -->
  <g>
    <rect x="60" y="530" width="400" height="190" rx="8" fill="#7f1d1d" stroke="#dc2626" stroke-width="2" />
    <path d="M 60 560 L 460 560" stroke="#dc2626" stroke-width="1.5" />
    <text x="260.0" y="550" text-anchor="middle" fill="#fee2e2" font-size="13" font-weight="bold">4A. BROKEN CHAIN / FRAUD DETECTED</text>
    <text x="74" y="580" fill="#e2e8f0" font-size="11.5">• Status: BROKEN LINEAGE ALERT</text>
    <text x="74" y="600" fill="#e2e8f0" font-size="11.5">• Finding: Intermediate deed party mismatch!</text>
    <text x="74" y="620" fill="#e2e8f0" font-size="11.5">• Impact: Title invalid; transaction rejected</text>
    <text x="74" y="640" fill="#e2e8f0" font-size="11.5">• Penalty: -35 Points from Trust Score</text>
  </g>
  <!-- Node: 4B. VERIFIED UNBROKEN CHAIN -->
  <g>
    <rect x="500" y="530" width="400" height="190" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="2" />
    <path d="M 500 560 L 900 560" stroke="#16a34a" stroke-width="1.5" />
    <text x="700.0" y="550" text-anchor="middle" fill="#dcfce7" font-size="13" font-weight="bold">4B. VERIFIED UNBROKEN CHAIN</text>
    <text x="514" y="580" fill="#e2e8f0" font-size="11.5">• Status: UNBROKEN CHAIN VERIFIED</text>
    <text x="514" y="600" fill="#e2e8f0" font-size="11.5">• Finding: 100% continuous lineage to CS/SA</text>
    <text x="514" y="620" fill="#e2e8f0" font-size="11.5">• Impact: Clean market title ready for conveyance</text>
    <text x="514" y="640" fill="#e2e8f0" font-size="11.5">• Reward: +35 Points to Trust Score</text>
  </g>
</svg>