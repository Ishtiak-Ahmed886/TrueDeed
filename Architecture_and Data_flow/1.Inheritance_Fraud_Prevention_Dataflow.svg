<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%" style="background:#0f172a; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="20" width="920" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="480" y="50" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="700">1.2 Farayez Inheritance Fraud Prevention — End-to-End Data Flow</text>
  <text x="480" y="72" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Sequential Execution Pipeline: From Citizen Entry to Real-Time Fraud Intercept</text>
  <line x1="310" y1="190" x2="350" y2="190" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="280.5" y="172.0" width="99" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="330.0" y="185.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Submit Data</text>
  <line x1="610" y1="190" x2="650" y2="190" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="598.5" y="172.0" width="63" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="630.0" y="185.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Compute</text>
  <line x1="780" y1="260" x2="780" y2="320" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="744.0" y="272.0" width="72" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="780.0" y="285.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Evaluate</text>
  <line x1="650" y1="390" x2="610" y2="390" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="585.0" y="372.0" width="90" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="630.0" y="385.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Log Result</text>
  <line x1="350" y1="390" x2="310" y2="390" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="267.0" y="372.0" width="126" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="330.0" y="385.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Dispatch Alert</text>
  <line x1="180" y1="460" x2="180" y2="520" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="126.0" y="472.0" width="108" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="180.0" y="485.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Final Impact</text>
  <!-- Node: STEP 1: USER SUBMISSION -->
  <g filter="url(#shadow)">
    <rect x="50" y="120" width="260" height="140" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="2" />
    <path d="M 50 148 L 310 148" stroke="#0d9488" stroke-width="1.5" />
    <text x="180.0" y="139" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="700">STEP 1: USER SUBMISSION</text>
    <text x="64" y="168" fill="#e2e8f0" font-size="11.5" font-weight="500">• Citizen / Buyer Inputs:</text>
    <text x="64" y="188" fill="#e2e8f0" font-size="11.5" font-weight="500">  - Total Land: 60 Decimals</text>
    <text x="64" y="208" fill="#e2e8f0" font-size="11.5" font-weight="500">  - Heirs: 2 Sons, 2 Daughters</text>
    <text x="64" y="228" fill="#e2e8f0" font-size="11.5" font-weight="500">  - Seller: Elder Son</text>
    <text x="64" y="248" fill="#e2e8f0" font-size="11.5" font-weight="500">  - Selling Claim: 30 Decimals</text>
  </g>
  <!-- Node: STEP 2: API INGESTION -->
  <g filter="url(#shadow)">
    <rect x="350" y="120" width="260" height="140" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <path d="M 350 148 L 610 148" stroke="#0284c7" stroke-width="1.5" />
    <text x="480.0" y="139" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="700">STEP 2: API INGESTION</text>
    <text x="364" y="168" fill="#e2e8f0" font-size="11.5" font-weight="500">• FastAPI Gateway handles request</text>
    <text x="364" y="188" fill="#e2e8f0" font-size="11.5" font-weight="500">• Validates integer/float values</text>
    <text x="364" y="208" fill="#e2e8f0" font-size="11.5" font-weight="500">• Payload: {land: 60.0,</text>
    <text x="364" y="228" fill="#e2e8f0" font-size="11.5" font-weight="500">   sons: 2, daughters: 2,</text>
    <text x="364" y="248" fill="#e2e8f0" font-size="11.5" font-weight="500">   claim: 30.0}</text>
  </g>
  <!-- Node: STEP 3: FARAYEZ MATH -->
  <g filter="url(#shadow)">
    <rect x="650" y="120" width="260" height="140" rx="8" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <path d="M 650 148 L 910 148" stroke="#9333ea" stroke-width="1.5" />
    <text x="780.0" y="139" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="700">STEP 3: FARAYEZ MATH</text>
    <text x="664" y="168" fill="#e2e8f0" font-size="11.5" font-weight="500">• Calculate Inheritance Points:</text>
    <text x="664" y="188" fill="#e2e8f0" font-size="11.5" font-weight="500">  - 2 Sons * 2 = 4 Points</text>
    <text x="664" y="208" fill="#e2e8f0" font-size="11.5" font-weight="500">  - 2 Daughters * 1 = 2 Points</text>
    <text x="664" y="228" fill="#e2e8f0" font-size="11.5" font-weight="500">  - Total Points = 6</text>
    <text x="664" y="248" fill="#e2e8f0" font-size="11.5" font-weight="500">• Value / Point = 60 / 6 = 10</text>
  </g>
  <!-- Node: STEP 4: QUOTA EVALUATION -->
  <g filter="url(#shadow)">
    <rect x="650" y="320" width="260" height="140" rx="8" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <path d="M 650 348 L 910 348" stroke="#9333ea" stroke-width="1.5" />
    <text x="780.0" y="339" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="700">STEP 4: QUOTA EVALUATION</text>
    <text x="664" y="368" fill="#e2e8f0" font-size="11.5" font-weight="500">• Elder Son's Share: 2 * 10 = 20</text>
    <text x="664" y="388" fill="#e2e8f0" font-size="11.5" font-weight="500">• Compare Claim vs Quota:</text>
    <text x="664" y="408" fill="#e2e8f0" font-size="11.5" font-weight="500">  - Deeded Claim = 30 Decimals</text>
    <text x="664" y="428" fill="#e2e8f0" font-size="11.5" font-weight="500">  - Legal Ceiling = 20 Decimals</text>
    <text x="664" y="448" fill="#e2e8f0" font-size="11.5" font-weight="500">• Condition: 30 > 20 (VIOLATION!)</text>
  </g>
  <!-- Node: STEP 5: AUDIT LOGGING -->
  <g filter="url(#shadow)">
    <rect x="350" y="320" width="260" height="140" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <path d="M 350 348 L 610 348" stroke="#0284c7" stroke-width="1.5" />
    <text x="480.0" y="339" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="700">STEP 5: AUDIT LOGGING</text>
    <text x="364" y="368" fill="#e2e8f0" font-size="11.5" font-weight="500">• Calculate Surplus: 10 Decimals</text>
    <text x="364" y="388" fill="#e2e8f0" font-size="11.5" font-weight="500">• Assign Status: FRAUD_DETECTED</text>
    <text x="364" y="408" fill="#e2e8f0" font-size="11.5" font-weight="500">• Deduct points from Trust Score</text>
    <text x="364" y="428" fill="#e2e8f0" font-size="11.5" font-weight="500">• Archive event in Security Ledger</text>
  </g>
  <!-- Node: STEP 6: REAL-TIME ALERT -->
  <g filter="url(#shadow)">
    <rect x="50" y="320" width="260" height="140" rx="8" fill="#7f1d1d" stroke="#dc2626" stroke-width="2" />
    <path d="M 50 348 L 310 348" stroke="#dc2626" stroke-width="1.5" />
    <text x="180.0" y="339" text-anchor="middle" fill="#fee2e2" font-size="13" font-weight="700">STEP 6: REAL-TIME ALERT</text>
    <text x="64" y="368" fill="#e2e8f0" font-size="11.5" font-weight="500">• UI renders Red Warning Card:</text>
    <text x="64" y="388" fill="#e2e8f0" font-size="11.5" font-weight="500">  'CRITICAL FRAUD: Seller is</text>
    <text x="64" y="408" fill="#e2e8f0" font-size="11.5" font-weight="500">   selling 30 decimals from an</text>
    <text x="64" y="428" fill="#e2e8f0" font-size="11.5" font-weight="500">   eligible share of 20 decimals!'</text>
    <text x="64" y="448" fill="#e2e8f0" font-size="11.5" font-weight="500">• Buyers protected from dispute</text>
  </g>
  <!-- Node: STEP 7: COMPREHENSIVE CITIZEN IMPACT & VALUE DELIVERED -->
  <g filter="url(#shadow)">
    <rect x="50" y="520" width="860" height="190" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="2" />
    <path d="M 50 548 L 910 548" stroke="#16a34a" stroke-width="1.5" />
    <text x="480.0" y="539" text-anchor="middle" fill="#dcfce7" font-size="13" font-weight="700">STEP 7: COMPREHENSIVE CITIZEN IMPACT & VALUE DELIVERED</text>
    <text x="64" y="568" fill="#e2e8f0" font-size="11.5" font-weight="500">• Proactive Protection: Stops illegal transfers before registration fee or token money is paid.</text>
    <text x="64" y="588" fill="#e2e8f0" font-size="11.5" font-weight="500">• Protects Female Heirs: Guarantees daughters' inherited shares cannot be secretly liquidated by brothers.</text>
    <text x="64" y="608" fill="#e2e8f0" font-size="11.5" font-weight="500">• Unburdens Civil Courts: Eliminates the root cause of generational partition suits across Bangladesh.</text>
    <text x="64" y="628" fill="#e2e8f0" font-size="11.5" font-weight="500">• Trust Score Output: Generates verifiable audit trail for mortgage banks and government land offices.</text>
  </g>
</svg>