<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" style="background:#0f172a; font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="20" width="920" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="480" y="50" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">1.2 Farayez Inheritance Fraud Prevention - End-to-End Data Flow</text>
  <text x="480" y="72" text-anchor="middle" fill="#94a3b8" font-size="12">Sequential Execution Pipeline: From Citizen Entry to Real-Time Fraud Intercept</text>
  <line x1="310" y1="190" x2="350" y2="190" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="280.5" y="172.0" width="99" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="330.0" y="186.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Submit Data</text>
  <line x1="610" y1="190" x2="650" y2="190" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="598.5" y="172.0" width="63" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="630.0" y="186.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Compute</text>
  <line x1="780" y1="260" x2="780" y2="310" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="744.0" y="267.0" width="72" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="780.0" y="281.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Evaluate</text>
  <line x1="650" y1="380" x2="610" y2="380" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="585.0" y="362.0" width="90" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="630.0" y="376.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Log Result</text>
  <line x1="350" y1="380" x2="310" y2="380" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="267.0" y="362.0" width="126" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="330.0" y="376.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Dispatch Alert</text>
  <line x1="180" y1="450" x2="180" y2="500" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="126.0" y="457.0" width="108" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="180.0" y="471.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Final Impact</text>
  <!-- Node: STEP 1: USER SUBMISSION -->
  <g>
    <rect x="50" y="120" width="260" height="140" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="2" />
    <path d="M 50 150 L 310 150" stroke="#0d9488" stroke-width="1.5" />
    <text x="180.0" y="140" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="bold">STEP 1: USER SUBMISSION</text>
    <text x="64" y="170" fill="#e2e8f0" font-size="11.5">• Citizen / Buyer Inputs:</text>
    <text x="64" y="190" fill="#e2e8f0" font-size="11.5">  - Total Land: 60 Decimals</text>
    <text x="64" y="210" fill="#e2e8f0" font-size="11.5">  - Heirs: 2 Sons, 2 Daughters</text>
    <text x="64" y="230" fill="#e2e8f0" font-size="11.5">  - Seller: Elder Son</text>
    <text x="64" y="250" fill="#e2e8f0" font-size="11.5">  - Selling Claim: 30 Decimals</text>
  </g>
  <!-- Node: STEP 2: API INGESTION -->
  <g>
    <rect x="350" y="120" width="260" height="140" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <path d="M 350 150 L 610 150" stroke="#0284c7" stroke-width="1.5" />
    <text x="480.0" y="140" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="bold">STEP 2: API INGESTION</text>
    <text x="364" y="170" fill="#e2e8f0" font-size="11.5">• FastAPI Gateway handles request</text>
    <text x="364" y="190" fill="#e2e8f0" font-size="11.5">• Validates integer and float values</text>
    <text x="364" y="210" fill="#e2e8f0" font-size="11.5">• Payload: {land: 60.0,</text>
    <text x="364" y="230" fill="#e2e8f0" font-size="11.5">   sons: 2, daughters: 2,</text>
    <text x="364" y="250" fill="#e2e8f0" font-size="11.5">   claim: 30.0}</text>
  </g>
  <!-- Node: STEP 3: FARAYEZ MATH -->
  <g>
    <rect x="650" y="120" width="260" height="140" rx="8" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <path d="M 650 150 L 910 150" stroke="#9333ea" stroke-width="1.5" />
    <text x="780.0" y="140" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="bold">STEP 3: FARAYEZ MATH</text>
    <text x="664" y="170" fill="#e2e8f0" font-size="11.5">• Calculate Inheritance Points:</text>
    <text x="664" y="190" fill="#e2e8f0" font-size="11.5">  - 2 Sons * 2 = 4 Points</text>
    <text x="664" y="210" fill="#e2e8f0" font-size="11.5">  - 2 Daughters * 1 = 2 Points</text>
    <text x="664" y="230" fill="#e2e8f0" font-size="11.5">  - Total Points = 6</text>
    <text x="664" y="250" fill="#e2e8f0" font-size="11.5">• Value / Point = 60 / 6 = 10</text>
  </g>
  <!-- Node: STEP 4: QUOTA EVALUATION -->
  <g>
    <rect x="650" y="310" width="260" height="140" rx="8" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <path d="M 650 340 L 910 340" stroke="#9333ea" stroke-width="1.5" />
    <text x="780.0" y="330" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="bold">STEP 4: QUOTA EVALUATION</text>
    <text x="664" y="360" fill="#e2e8f0" font-size="11.5">• Elder Son&#x27;s Share: 2 * 10 = 20</text>
    <text x="664" y="380" fill="#e2e8f0" font-size="11.5">• Compare Claim vs Quota:</text>
    <text x="664" y="400" fill="#e2e8f0" font-size="11.5">  - Deeded Claim = 30 Decimals</text>
    <text x="664" y="420" fill="#e2e8f0" font-size="11.5">  - Legal Ceiling = 20 Decimals</text>
    <text x="664" y="440" fill="#e2e8f0" font-size="11.5">• Condition: 30 &gt; 20 (VIOLATION!)</text>
  </g>
  <!-- Node: STEP 5: AUDIT LOGGING -->
  <g>
    <rect x="350" y="310" width="260" height="140" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <path d="M 350 340 L 610 340" stroke="#0284c7" stroke-width="1.5" />
    <text x="480.0" y="330" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="bold">STEP 5: AUDIT LOGGING</text>
    <text x="364" y="360" fill="#e2e8f0" font-size="11.5">• Calculate Surplus: 10 Decimals</text>
    <text x="364" y="380" fill="#e2e8f0" font-size="11.5">• Assign Status: FRAUD_DETECTED</text>
    <text x="364" y="400" fill="#e2e8f0" font-size="11.5">• Deduct points from Trust Score</text>
    <text x="364" y="420" fill="#e2e8f0" font-size="11.5">• Archive event in Security Ledger</text>
  </g>
  <!-- Node: STEP 6: REAL-TIME ALERT -->
  <g>
    <rect x="50" y="310" width="260" height="140" rx="8" fill="#7f1d1d" stroke="#dc2626" stroke-width="2" />
    <path d="M 50 340 L 310 340" stroke="#dc2626" stroke-width="1.5" />
    <text x="180.0" y="330" text-anchor="middle" fill="#fee2e2" font-size="13" font-weight="bold">STEP 6: REAL-TIME ALERT</text>
    <text x="64" y="360" fill="#e2e8f0" font-size="11.5">• UI renders Red Warning Card:</text>
    <text x="64" y="380" fill="#e2e8f0" font-size="11.5">  &#x27;CRITICAL FRAUD: Seller is</text>
    <text x="64" y="400" fill="#e2e8f0" font-size="11.5">   selling 30 decimals from an</text>
    <text x="64" y="420" fill="#e2e8f0" font-size="11.5">   eligible share of 20 decimals!&#x27;</text>
    <text x="64" y="440" fill="#e2e8f0" font-size="11.5">• Buyers protected from dispute</text>
  </g>
  <!-- Node: STEP 7: COMPREHENSIVE CITIZEN IMPACT AND VALUE DELIVERED -->
  <g>
    <rect x="50" y="500" width="860" height="190" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="2" />
    <path d="M 50 530 L 910 530" stroke="#16a34a" stroke-width="1.5" />
    <text x="480.0" y="520" text-anchor="middle" fill="#dcfce7" font-size="13" font-weight="bold">STEP 7: COMPREHENSIVE CITIZEN IMPACT AND VALUE DELIVERED</text>
    <text x="64" y="550" fill="#e2e8f0" font-size="11.5">• Proactive Protection: Stops illegal transfers before registration fee or token money is paid.</text>
    <text x="64" y="570" fill="#e2e8f0" font-size="11.5">• Protects Female Heirs: Guarantees daughters&#x27; inherited shares cannot be secretly liquidated by brothers.</text>
    <text x="64" y="590" fill="#e2e8f0" font-size="11.5">• Unburdens Civil Courts: Eliminates the root cause of generational partition suits across Bangladesh.</text>
    <text x="64" y="610" fill="#e2e8f0" font-size="11.5">• Trust Score Output: Generates verifiable audit trail for mortgage banks and government land offices.</text>
  </g>
</svg>