<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 730" width="100%" height="100%" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#CCCCCC;--accent:#0078D4;--muted:#CCCCCCCC;--surface:#181818;--border:#CCCCCC;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>

<!-- ALT BLOCK FOR FRAUD vs VERIFIED -->
<g class="block" data-type="alt" data-label="উত্তরাধিকার যাচাই ফলাফল">
  <rect x="40" y="440" width="1060" height="230" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="440" width="260" height="20" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="450" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.85">alt [বিক্রীত জমি &gt; বৈধ অংশ (Over-Selling / Fraud)]</text>
  
  <line x1="40" y1="560" x2="1100" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="48" y="575" font-size="11" text-anchor="start" font-weight="600" fill="var(--_text-muted)" dy="3.85">[বিক্রীত জমি &lt;= বৈধ অংশ (Statutory Share Clear)]</text>
</g>

<!-- LIFELINES -->
<!-- Actor 1: User (x = 120) -->
<line class="lifeline" data-actor="User" x1="120" y1="92" x2="120" y2="690" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<!-- Actor 2: UI (x = 340) -->
<line class="lifeline" data-actor="UI" x1="340" y1="70" x2="340" y2="690" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<!-- Actor 3: API (x = 560) -->
<line class="lifeline" data-actor="API" x1="560" y1="70" x2="560" y2="690" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<!-- Actor 4: Farayez (x = 790) -->
<line class="lifeline" data-actor="Farayez" x1="790" y1="70" x2="790" y2="690" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<!-- Actor 5: DB (x = 1010) -->
<line class="lifeline" data-actor="DB" x1="1010" y1="70" x2="1010" y2="690" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />

<!-- MESSAGES -->
<!-- 1. User -> UI -->
<g class="message" data-from="User" data-to="UI" data-label="ইউজার ইনপুট দেয় (মোট জমি, ওয়ারিশ সংখ্যা, বিক্রয় দাবি)">
  <line x1="120" y1="120" x2="340" y2="120" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="230" y="110" font-size="11" text-anchor="middle" font-weight="500" fill="var(--_text-muted)" dy="3.85">ইউজার ইনপুট দেয় (মোট জমি, ওয়ারিশ সংখ্যা, বিক্রয় দাবি)</text>
</g>

<!-- 2. UI -> API -->
<g class="message" data-from="UI" data-to="API" data-label="POST /api/v1/verify-share { land: 60, sons: 2, daughters: 2, selling: 30 }">
  <line x1="340" y1="170" x2="560" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="450" y="160" font-size="11" text-anchor="middle" font-weight="500" fill="var(--_text-muted)" dy="3.85">POST /api/v1/verify-share { land: 60, sons: 2, selling: 30 }</text>
</g>

<!-- 3. API -> DB -->
<g class="message" data-from="API" data-to="DB" data-label="খতিয়ান ও মূল রেকর্ড কুয়েরি করে">
  <line x1="560" y1="220" x2="1010" y2="220" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="785" y="210" font-size="11" text-anchor="middle" font-weight="500" fill="var(--_text-muted)" dy="3.85">খতিয়ান ও মূল রেকর্ড কুয়েরি করে</text>
</g>

<!-- 4. DB -> API -->
<g class="message" data-from="DB" data-to="API" data-label="রেকর্ড ও ঐতিহাসিক হিস্যা ডাটা রিটার্ন">
  <line x1="1010" y1="265" x2="560" y2="265" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="785" y="255" font-size="11" text-anchor="middle" font-weight="500" fill="var(--_text-muted)" dy="3.85">রেকর্ড ও ঐতিহাসিক হিস্যা ডাটা রিটার্ন</text>
</g>

<!-- 5. API -> Farayez -->
<g class="message" data-from="API" data-to="Farayez" data-label="বৈধ অংশের অনুপাত ও সীমা গণনার অনুরোধ">
  <line x1="560" y1="315" x2="790" y2="315" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="675" y="305" font-size="11" text-anchor="middle" font-weight="500" fill="var(--_text-muted)" dy="3.85">বৈধ অংশের অনুপাত ও সীমা গণনার অনুরোধ</text>
</g>

<!-- 6. Farayez Self Call -->
<g class="message" data-from="Farayez" data-to="Farayez" data-label="ফারায়েজ সূত্র হিসাব: বৈধ অংশ = ২০, বিক্রয় = ৩০, অতিরিক্ত = ১০">
  <polyline points="790,360 820,360 820,385 790,385" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="830" y="372" font-size="11" text-anchor="start" font-weight="500" fill="var(--_text-muted)" dy="3.85">ফারায়েজ সূত্র হিসাব: বৈধ অংশ = ২০, বিক্রয় = ৩০, অতিরিক্ত = ১০</text>
</g>

<!-- ALT 1: Fraud Path -->
<g class="message" data-from="Farayez" data-to="API" data-label="{ status: &quot;FRAUD&quot;, excess: 10, legal_share: 20 }">
  <line x1="790" y1="480" x2="560" y2="480" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="675" y="470" font-size="11" text-anchor="middle" font-weight="500" fill="var(--_text-muted)" dy="3.85">{ status: &quot;FRAUD&quot;, excess: 10, legal_share: 20 }</text>
</g>
<g class="message" data-from="API" data-to="UI" data-label="409 Conflict + Critical Fraud Alert">
  <line x1="560" y1="510" x2="340" y2="510" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="450" y="500" font-size="11" text-anchor="middle" font-weight="500" fill="var(--_text-muted)" dy="3.85">409 Conflict + Critical Fraud Alert</text>
</g>
<g class="message" data-from="UI" data-to="User" data-label="🔴 স্ক্রিনে লাল কালিতে প্রতারণা সতর্কতা কার্ড প্রদর্শন!">
  <line x1="340" y1="540" x2="120" y2="540" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="230" y="530" font-size="11" text-anchor="middle" font-weight="600" fill="#f87171" dy="3.85">🔴 স্ক্রিনে লাল কালিতে প্রতারণা সতর্কতা কার্ড প্রদর্শন!</text>
</g>

<!-- ALT 2: Clear Path -->
<g class="message" data-from="Farayez" data-to="API" data-label="{ status: &quot;VERIFIED&quot;, quota: &quot;100% Valid&quot; }">
  <line x1="790" y1="600" x2="560" y2="600" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="675" y="590" font-size="11" text-anchor="middle" font-weight="500" fill="var(--_text-muted)" dy="3.85">{ status: &quot;VERIFIED&quot;, quota: &quot;100% Valid&quot; }</text>
</g>
<g class="message" data-from="API" data-to="UI" data-label="200 OK + Verified Badge Payload">
  <line x1="560" y1="630" x2="340" y2="630" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="450" y="620" font-size="11" text-anchor="middle" font-weight="500" fill="var(--_text-muted)" dy="3.85">200 OK + Verified Badge Payload</text>
</g>
<g class="message" data-from="UI" data-to="User" data-label="🟢 নিরাপদ ও অনুমোদিত উত্তরাধিকার ভেরিফাইড ব্যাজ প্রদর্শন!">
  <line x1="340" y1="660" x2="120" y2="660" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="230" y="650" font-size="11" text-anchor="middle" font-weight="600" fill="#4ade80" dy="3.85">🟢 নিরাপদ ও অনুমোদিত উত্তরাধিকার ভেরিফাইড ব্যাজ প্রদর্শন!</text>
</g>

<!-- ACTOR BOXES AT TOP -->
<!-- Actor 1: User -->
<g class="actor" data-id="User" data-label="ইউজার (ওয়ারিশ / ক্রেতা)" data-type="actor">
  <g transform="translate(102,32) scale(1.5)">
    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" fill="none" stroke="var(--_line)" stroke-width="0.67" />
    <path d="M15 10C15 11.6569 13.6569 13 12 13C10.3431 13 9 11.6569 9 10C9 8.34315 10.3431 7 12 7C13.6569 7 15 8.34315 15 10Z" fill="none" stroke="var(--_line)" stroke-width="0.67" />
    <path d="M5.62842 18.3563C7.08963 17.0398 9.39997 16 12 16C14.6 16 16.9104 17.0398 18.3716 18.3563" fill="none" stroke="var(--_line)" stroke-width="0.67" />
  </g>
  <text x="120" y="84" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ইউজার (ওয়ারিশ / ক্রেতা)</text>
</g>

<!-- Actor 2: UI -->
<g class="actor" data-id="UI" data-label="ফ্রন্টএন্ড ড্যাশবোর্ড" data-type="participant">
  <rect x="250" y="30" width="180" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="340" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ফ্রন্টএন্ড ড্যাশবোর্ড</text>
</g>

<!-- Actor 3: API -->
<g class="actor" data-id="API" data-label="ব্যাকএন্ড গেটওয়ে (FastAPI)" data-type="participant">
  <rect x="465" y="30" width="190" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="560" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ব্যাকএন্ড গেটওয়ে (FastAPI)</text>
</g>

<!-- Actor 4: Farayez -->
<g class="actor" data-id="Farayez" data-label="ফারায়েজ ইঞ্জিন (Math Core)" data-type="participant">
  <rect x="690" y="30" width="200" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="790" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ফারায়েজ ইঞ্জিন (Math Core)</text>
</g>

<!-- Actor 5: DB -->
<g class="actor" data-id="DB" data-label="খতিয়ান ডাটাবেজ (Postgres)" data-type="participant">
  <rect x="910" y="30" width="200" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="1010" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">খতিয়ান ডাটাবেজ (Postgres)</text>
</g>
</svg>
