    <text x="524" y="218" fill="#e2e8f0" font-size="11.5" font-weight="500">• System queries Lock Ledger for Key '...DAAG105'</text>
  </g>
  <!-- Node: REAL-TIME CONFLICT RESOLUTION & FRAUD INTERCEPT -->
  <g filter="url(#shadow)">
    <rect x="50" y="290" width="860" height="190" rx="8" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <path d="M 50 318 L 910 318" stroke="#9333ea" stroke-width="1.5" />
