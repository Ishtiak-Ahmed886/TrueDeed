  <rect x="200.5" y="257.0" width="99" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="250.0" y="270.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Lock Active</text>
  <line x1="710" y1="260" x2="710" y2="290" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="633.5" y="257.0" width="153" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="710.0" y="270.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Conflict Detected</text>
  <line x1="480" y1="480" x2="480" y2="510" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="403.5" y="477.0" width="153" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="480.0" y="490.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Mutation Complete</text>
  <!-- Node: DAY 1: BUYER A TRANSACTS LEGITIMATELY -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="400" height="150" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="2" />
    <path d="M 50 138 L 450 138" stroke="#0d9488" stroke-width="1.5" />
