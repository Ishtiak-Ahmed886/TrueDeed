    <text x="524" y="158" fill="#e2e8f0" font-size="11.5" font-weight="500">• Seller shows old paper Khatian (still in seller name)</text>
    <text x="524" y="178" fill="#e2e8f0" font-size="11.5" font-weight="500">• Attempts to sell identical Plot 105 to Buyer B</text>
