    <text x="64" y="158" fill="#e2e8f0" font-size="11.5" font-weight="500">• Buyer A verifies and executes deed for Plot 105</text>
    <text x="64" y="178" fill="#e2e8f0" font-size="11.5" font-weight="500">• TrueDeed creates Active Plot Lock:</text>
    <text x="64" y="198" fill="#e2e8f0" font-size="11.5" font-weight="500">  - Key: 'DHAKA_SAVAR_MOUZA12_DAAG105'</text>
    <text x="64" y="218" fill="#e2e8f0" font-size="11.5" font-weight="500">  - Status: MUTATION_PENDING (45-Day TTL)</text>
    <text x="64" y="238" fill="#e2e8f0" font-size="11.5" font-weight="500">  - Protected Buyer: Buyer A</text>
