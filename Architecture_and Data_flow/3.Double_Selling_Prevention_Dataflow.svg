    <text x="64" y="378" fill="#e2e8f0" font-size="11.5" font-weight="500">• Alert Dispatched to Buyer B: 'CRITICAL ALERT: Plot 105 is currently pending mutation for another buyer!'</text>
    <text x="64" y="398" fill="#e2e8f0" font-size="11.5" font-weight="500">• Alert Dispatched to Buyer A: 'SECURITY NOTICE: A duplicate verification attempt on Plot 105 was intercepted!'</text>
  </g>
  <!-- Node: DAY 35: AC LAND MUTATION FINALIZATION -->
  <g filter="url(#shadow)">
    <rect x="50" y="510" width="860" height="210" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="2" />
    <path d="M 50 538 L 910 538" stroke="#16a34a" stroke-width="1.5" />
    <text x="480.0" y="529" text-anchor="middle" fill="#dcfce7" font-size="13" font-weight="700">DAY 35: AC LAND MUTATION FINALIZATION</text>
    <text x="64" y="558" fill="#e2e8f0" font-size="11.5" font-weight="500">• AC Land finalizes e-Mutation in favor of Buyer A.</text>
    <text x="64" y="578" fill="#e2e8f0" font-size="11.5" font-weight="500">• Government Khatian permanently updated to Buyer A.</text>
    <text x="64" y="598" fill="#e2e8f0" font-size="11.5" font-weight="500">• TrueDeed automatically releases the 45-day temporary lock.</text>
    <text x="64" y="618" fill="#e2e8f0" font-size="11.5" font-weight="500">• Conclusion: Double-selling rendered mathematically impossible; buyer capital 100% safeguarded.</text>
