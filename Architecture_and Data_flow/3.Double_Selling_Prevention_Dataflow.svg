  <!-- Node: DAY 12: CORRUPT SELLER TARGETS BUYER B -->
  <g filter="url(#shadow)">
    <rect x="510" y="110" width="400" height="150" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
