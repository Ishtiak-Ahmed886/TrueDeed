    <text x="74" y="480" fill="#e2e8f0" font-size="11.5">• Quota Formula: Share_i = (k_i / Total_Points) * Total_Estate</text>
    <text x="74" y="500" fill="#e2e8f0" font-size="11.5">• Decision Boundary: If Deeded_Selling_Area &gt; Legal_Share -&gt; Trigger FRAUD_ALERT</text>
    <text x="74" y="520" fill="#e2e8f0" font-size="11.5">• Exact Surplus Metric: Surplus_Area = Deeded_Selling_Area - Legal_Share</text>
  </g>
