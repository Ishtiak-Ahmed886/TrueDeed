    <text x="74" y="328" fill="#e2e8f0" font-size="11.5" font-weight="500">• Data Sanitization: Convert Bengali Numerals ('২০ শতক') to Standard Floats (20.0)</text>
    <text x="74" y="348" fill="#e2e8f0" font-size="11.5" font-weight="500">• Validation Contract: Enforce Schema Types and Missing Parameter Guardrails</text>
  </g>
  <!-- Node: 3. ALGORITHMIC FARAYEZ MATH CORE (CALCULATION & COMPARISON) -->
  <g filter="url(#shadow)">
    <rect x="60" y="410" width="840" height="130" rx="8" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <path d="M 60 438 L 900 438" stroke="#9333ea" stroke-width="1.5" />
    <text x="480.0" y="429" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="700">3. ALGORITHMIC FARAYEZ MATH CORE (CALCULATION & COMPARISON)</text>
    <text x="74" y="458" fill="#e2e8f0" font-size="11.5" font-weight="500">• Statutory Logic: Muslim Family Laws Ordinance 1961 (1 Son = 2 Daughters)</text>
    <text x="74" y="478" fill="#e2e8f0" font-size="11.5" font-weight="500">• Quota Formula: Share_i = (k_i / Total_Points) * Total_Estate</text>
    <text x="74" y="498" fill="#e2e8f0" font-size="11.5" font-weight="500">• Decision Boundary: If Deeded_Selling_Area > Legal_Share -> Trigger FRAUD_ALERT</text>
    <text x="74" y="518" fill="#e2e8f0" font-size="11.5" font-weight="500">• Exact Surplus Metric: Surplus_Area = Deeded_Selling_Area - Legal_Share</text>
  </g>
  <!-- Node: 4A. FRAUD INTERCEPT ALERT -->
  <g filter="url(#shadow)">
    <rect x="60" y="570" width="400" height="140" rx="8" fill="#7f1d1d" stroke="#dc2626" stroke-width="2" />
    <path d="M 60 598 L 460 598" stroke="#dc2626" stroke-width="1.5" />
