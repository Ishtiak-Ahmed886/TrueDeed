  <line x1="260" y1="540" x2="260" y2="570" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="156.5" y="537.0" width="207" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="260.0" y="551.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Selling &gt; Share (Fraud)</text>
  <line x1="700" y1="540" x2="700" y2="570" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
