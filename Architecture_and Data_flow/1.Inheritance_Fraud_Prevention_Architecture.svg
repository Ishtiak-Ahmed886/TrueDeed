  <g>
    <rect x="60" y="120" width="840" height="110" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="2" />
    <path d="M 60 150 L 900 150" stroke="#0d9488" stroke-width="1.5" />
    <text x="480.0" y="140" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="bold">1. USER INTERFACE AND DEED INPUT LAYER</text>
    <text x="74" y="170" fill="#e2e8f0" font-size="11.5">• Web Dropzone: Physical Deed Scan / Porcha Image / PDF</text>
