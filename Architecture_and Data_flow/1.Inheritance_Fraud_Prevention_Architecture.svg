  <rect x="403.5" y="227.0" width="153" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="480.0" y="240.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">POST JSON Payload</text>
  <line x1="480" y1="380" x2="480" y2="410" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="381.0" y="377.0" width="198" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="480.0" y="390.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Forward to Math Engine</text>
  <line x1="260" y1="540" x2="260" y2="570" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="156.5" y="537.0" width="207" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="260.0" y="550.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Selling > Share (Fraud)</text>
  <line x1="700" y1="540" x2="700" y2="570" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="596.5" y="537.0" width="207" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="700.0" y="550.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Selling <= Share (Safe)</text>
