    <text x="74" y="658" fill="#e2e8f0" font-size="11.5" font-weight="500">• Action: Transaction Blocked & Logged</text>
    <text x="74" y="678" fill="#e2e8f0" font-size="11.5" font-weight="500">• Message: Seller exceeds legal share!</text>
  </g>
