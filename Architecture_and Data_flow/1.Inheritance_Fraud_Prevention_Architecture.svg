    <text x="514" y="618" fill="#e2e8f0" font-size="11.5" font-weight="500">• Status: 🟢 SHARE_VERIFIED</text>
    <text x="514" y="638" fill="#e2e8f0" font-size="11.5" font-weight="500">• Visual: Green Certified Badge</text>
    <text x="514" y="658" fill="#e2e8f0" font-size="11.5" font-weight="500">• Action: +25 Points to TrueDeed Trust Score</text>
    <text x="514" y="678" fill="#e2e8f0" font-size="11.5" font-weight="500">• Message: Deeded share within legal quota</text>
