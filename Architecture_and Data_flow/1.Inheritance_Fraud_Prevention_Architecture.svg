  <g filter="url(#shadow)">
    <rect x="60" y="120" width="840" height="110" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="2" />
    <path d="M 60 148 L 900 148" stroke="#0d9488" stroke-width="1.5" />
    <text x="480.0" y="139" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="700">1. USER INTERFACE & DEED INPUT LAYER</text>
    <text x="74" y="168" fill="#e2e8f0" font-size="11.5" font-weight="500">• Web Dropzone: Physical Deed Scan / Porcha Image / PDF</text>
    <text x="74" y="188" fill="#e2e8f0" font-size="11.5" font-weight="500">• Input Form: Total Baseline Land Area (Decimals), Heir Breakdown (Sons, Daughters, Spouses)</text>
    <text x="74" y="208" fill="#e2e8f0" font-size="11.5" font-weight="500">• Transaction Claim: Seller Identity, Deeded Selling Acreage</text>
