<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1020" width="100%" height="100%" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#CCCCCC;--accent:#0078D4;--muted:#CCCCCCCC;--surface:#181818;--border:#CCCCCC;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>

<!-- ১. ক্লায়েন্ট লেয়ার (Frontend / UI) -->
<g class="subgraph" data-id="ClientLayer" data-label="১. ক্লায়েন্ট লেয়ার (Frontend / UI)">
  <rect x="30" y="40" width="920" height="135" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="40" width="920" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="45" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.2">১. ক্লায়েন্ট লেয়ার (Frontend / UI)</text>
</g>

<!-- ২. সার্ভিস / এপিআই লেয়ার (Backend Gateway) -->
<g class="subgraph" data-id="APILayer" data-label="২. সার্ভিস / এপিআই লেয়ার (Backend Gateway)">
  <rect x="30" y="240" width="920" height="120" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="240" width="920" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="45" y="254" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.2">২. সার্ভিস / এপিআই লেয়ার (Backend Gateway)</text>
</g>

<!-- ৩. কোর বিজনেস লজিক লেয়ার (Core Engines) -->
<g class="subgraph" data-id="LogicLayer" data-label="৩. কোর বিজনেস লজিক লেয়ার (Core Engines)">
  <rect x="30" y="430" width="920" height="295" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="430" width="920" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="45" y="444" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.2">৩. কোর বিজনেস লজিক লেয়ার (Core Engines)</text>
</g>

<!-- ৪. ডাটা লেয়ার (Storage & Database) -->
<g class="subgraph" data-id="DataLayer" data-label="৪. ডাটা লেয়ার (Storage &amp; Database)">
  <rect x="30" y="795" width="920" height="145" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="795" width="920" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="45" y="809" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.2">৪. ডাটা লেয়ার (Storage &amp; Database)</text>
</g>

<!-- CONNECTING EDGES -->
<!-- Form -> Router (JSON Request) -->
<polyline class="edge" data-from="Form" data-to="Router" data-style="solid" points="230,145 230,205 700,205 700,285" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- Router -> LogicLayer (Dispatch to Farayez & Rules) -->
<polyline class="edge" data-from="Router" data-to="LogicLayer" data-style="solid" points="700,345 700,430" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- LogicLayer -> DB (Query Records) -->
<polyline class="edge" data-from="LogicLayer" data-to="DB" data-style="solid" points="450,725 450,845" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- DB -> LogicLayer (Return Ledger Data) -->
<polyline class="edge" data-from="DB" data-to="LogicLayer" data-style="solid" points="530,845 530,725" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- LogicLayer -> Router (Calculated Score & Alert) -->
<polyline class="edge" data-from="LogicLayer" data-to="Router" data-style="solid" points="750,430 750,345" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- Router -> ResultCard (JSON Response) -->
<polyline class="edge" data-from="Router" data-to="ResultCard" data-style="solid" points="800,285 800,205 800,145" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- EDGE LABELS -->
<g class="edge-label" data-from="Form" data-to="Router" data-label="JSON Request">
  <rect x="360" y="190" width="105" height="30" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="412.5" y="205" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">JSON Request</text>
</g>
<g class="edge-label" data-from="LogicLayer" data-to="Router" data-label="Calculated Score &amp; Alert">
  <rect x="670" y="380" width="145" height="30" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="742.5" y="395" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">Calculated Score &amp; Alert</text>
</g>
<g class="edge-label" data-from="Router" data-to="ResultCard" data-label="JSON Response">
  <rect x="745" y="190" width="110" height="30" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="800" y="205" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">JSON Response</text>
</g>

<!-- NODES IN LAYER 1 (ClientLayer) -->
<g class="node" data-id="Form" data-label="ইনপুট ফর্ম: মোট জমি, ওয়ারিশ সংখ্যা, বিক্রীত পরিমাণ" data-shape="rectangle">
  <rect x="50" y="85" width="360" height="60" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="230" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)">
    <tspan x="230" dy="-3.9">ইনপুট ফর্ম (Deed Input Form)</tspan>
    <tspan x="230" dy="16.9">মোট জমি, ওয়ারিশ সংখ্যা, বিক্রীত পরিমাণ</tspan>
  </text>
</g>
<g class="node" data-id="UI" data-label="মডার্ন ওয়েব ড্যাশবোর্ড (HTML5 / Tailwind CSS / React)" data-shape="rectangle">
  <rect x="430" y="85" width="220" height="60" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="540" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)">
    <tspan x="540" dy="-3.9">মডার্ন ওয়েব ড্যাশবোর্ড</tspan>
    <tspan x="540" dy="16.9">(HTML5 / Tailwind CSS / React)</tspan>
  </text>
</g>
<g class="node" data-id="ResultCard" data-label="লাইভ রেজাল্ট কার্ড (Trust Score, 🔴 Fraud Alert, 🟢 Verified Badge)" data-shape="rectangle">
  <rect x="670" y="85" width="260" height="60" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="800" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)">
    <tspan x="800" dy="-3.9">লাইভ রেজাল্ট কার্ড</tspan>
    <tspan x="800" dy="16.9">(Trust Score, 🔴 Alert, 🟢 Badge)</tspan>
  </text>
</g>

<!-- NODES IN LAYER 2 (APILayer) -->
<g class="node" data-id="API" data-label="FastAPI / Flask REST API Server" data-shape="rectangle">
  <rect x="70" y="285" width="370" height="55" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="255" y="315" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)">
    <tspan x="255" dy="-3.9">FastAPI / Flask REST API Server</tspan>
    <tspan x="255" dy="16.9">(High-Throughput Async Backend)</tspan>
  </text>
</g>
<g class="node" data-id="Router" data-label="/api/v1/verify-share &amp; /api/v1/verify-deed" data-shape="rectangle">
  <rect x="470" y="285" width="460" height="55" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="700" y="315" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)">
    <tspan x="700" dy="-3.9">API Routing Endpoints</tspan>
    <tspan x="700" dy="16.9">/api/v1/verify-share &amp; /api/v1/verify-deed</tspan>
  </text>
</g>

<!-- NODES IN LAYER 3 (LogicLayer: 2x2 spacious grid) -->
<g class="node" data-id="LockEngine" data-label="C. Double-Selling Lock Engine (দাগে সক্রিয় ট্রানজেকশন চেক)" data-shape="rectangle">
  <rect x="60" y="475" width="410" height="85" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="265" y="515" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)">
    <tspan x="265" dy="-6">C. Double-Selling Lock Engine</tspan>
    <tspan x="265" dy="18">(দাগে সক্রিয় ট্রানজেকশন ও হোল্ড চেক)</tspan>
  </text>
</g>
<g class="node" data-id="Farayez" data-label="B. Farayez Math Engine (উত্তরাধিকার অনুপাত ও অংশের হিসাব)" data-shape="rectangle">
  <rect x="510" y="475" width="410" height="85" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="715" y="515" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)">
    <tspan x="715" dy="-6">B. Farayez Math Engine</tspan>
    <tspan x="715" dy="18">(উত্তরাধিকার অনুপাত ও অংশের হিসাব)</tspan>
  </text>
</g>
<g class="node" data-id="OCR" data-label="A. Bangla OCR &amp; Extractor (দলিলের ছবি থেকে টেক্সট এক্সট্র্যাক্ট)" data-shape="rectangle">
  <rect x="60" y="595" width="410" height="85" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="265" y="635" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)">
    <tspan x="265" dy="-6">A. Bangla OCR &amp; Extractor</tspan>
    <tspan x="265" dy="18">(দলিলের ছবি থেকে টেক্সট এক্সট্র্যাক্ট)</tspan>
  </text>
</g>
<g class="node" data-id="TrustScore" data-label="D. Trust Scoring Algorithm (০-১০০% সিকিউরিটি স্কোর)" data-shape="rectangle">
  <rect x="510" y="595" width="410" height="85" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="715" y="635" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)">
    <tspan x="715" dy="-6">D. Trust Scoring Algorithm</tspan>
    <tspan x="715" dy="18">(০-১০০% সিকিউরিটি স্কোর)</tspan>
  </text>
</g>

<!-- NODES IN LAYER 4 (DataLayer: Database Cylinder) -->
<g class="node" data-id="DB" data-label="SQLite / PostgreSQL (খতিয়ান, দাগ, ওয়ারিশ রেকর্ড ও হিস্ট্রি)" data-shape="cylinder">
  <rect x="240" y="845" width="500" height="60" fill="var(--_node-fill)" stroke="none" />
  <line x1="240" y1="845" x2="240" y2="905" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <line x1="740" y1="845" x2="740" y2="905" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <ellipse cx="490" cy="905" rx="250" ry="9" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <ellipse cx="490" cy="845" rx="250" ry="9" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="490" y="875" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)">
    <tspan x="490" dy="-4">SQLite / PostgreSQL</tspan>
    <tspan x="490" dy="18">(খতিয়ান, দাগ, ওয়ারিশ রেকর্ড ও হিস্ট্রি)</tspan>
  </text>
</g>
</svg>
