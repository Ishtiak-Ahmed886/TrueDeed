<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" style="background:#0f172a; font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="20" width="920" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="480" y="50" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">3.1 Double-Selling Prevention - 45-Day Active Plot Lock Architecture</text>
  <text x="480" y="72" text-anchor="middle" fill="#94a3b8" font-size="12">Module 3: Concurrency Control and Mutex Lock Layer for Land Conveyancing</text>
  <line x1="480" y1="230" x2="480" y2="250" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="426.0" y="222.0" width="108" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="480.0" y="236.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Generate Key</text>
  <line x1="480" y1="380" x2="480" y2="400" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="430.5" y="372.0" width="99" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="480.0" y="386.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Query Mutex</text>
  <line x1="260" y1="530" x2="260" y2="550" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="192.5" y="522.0" width="135" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="260.0" y="536.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Conflict Exists</text>
  <line x1="700" y1="530" x2="700" y2="550" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="650.5" y="522.0" width="99" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="700.0" y="536.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">No Conflict</text>
  <!-- Node: 1. REGISTRY TRANSACTION INTAKE GATEWAY -->
  <g>
    <rect x="60" y="110" width="840" height="120" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="2" />
    <path d="M 60 140 L 900 140" stroke="#0d9488" stroke-width="1.5" />
    <text x="480.0" y="130" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="bold">1. REGISTRY TRANSACTION INTAKE GATEWAY</text>
    <text x="74" y="160" fill="#e2e8f0" font-size="11.5">• Event Trigger: Deed verification or registration filing initiated at Sub-Registry or TrueDeed portal</text>
    <text x="74" y="180" fill="#e2e8f0" font-size="11.5">• Composite Key Generator: Creates unique lock hash = SHA256(District_Upazila_Mouza_Khatian_Daag)</text>
    <text x="74" y="200" fill="#e2e8f0" font-size="11.5">• Lock Inquirer: Checks active distributed ledger for existing locks on the identical composite key</text>
  </g>
  <!-- Node: 2. DISTRIBUTED TEMPORAL MUTEX LOCK MANAGER -->
  <g>
    <rect x="60" y="250" width="840" height="130" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <path d="M 60 280 L 900 280" stroke="#0284c7" stroke-width="1.5" />
    <text x="480.0" y="270" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="bold">2. DISTRIBUTED TEMPORAL MUTEX LOCK MANAGER</text>
    <text x="74" y="300" fill="#e2e8f0" font-size="11.5">• Concurrency Rule: Only ONE active pending transaction permitted per plot during mutation latency window</text>
    <text x="74" y="320" fill="#e2e8f0" font-size="11.5">• Time-to-Live (TTL): 45 Days (matching statutory e-Mutation duration under Section 143, SAT Act 1950)</text>
    <text x="74" y="340" fill="#e2e8f0" font-size="11.5">• Lock Release Trigger: Automated webhook upon AC Land mutation completion or formal transaction cancellation</text>
  </g>
  <!-- Node: 3. CONFLICT DETECTION AND ANTI-DOUBLE SELLING CORE -->
  <g>
    <rect x="60" y="400" width="840" height="130" rx="8" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <path d="M 60 430 L 900 430" stroke="#9333ea" stroke-width="1.5" />
    <text x="480.0" y="420" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="bold">3. CONFLICT DETECTION AND ANTI-DOUBLE SELLING CORE</text>
    <text x="74" y="450" fill="#e2e8f0" font-size="11.5">• Lock State: MUTATION_PENDING (Active Lock engaged)</text>
    <text x="74" y="470" fill="#e2e8f0" font-size="11.5">• Secondary Transaction Attempt: Intercepts secondary deed verification on locked composite key</text>
    <text x="74" y="490" fill="#e2e8f0" font-size="11.5">• Fraud Classifier: Flags prospective duplicate conveyancing before secondary deed stamp execution</text>
  </g>
  <!-- Node: 4A. CONCURRENT TRANSFER ALERT -->
  <g>
    <rect x="60" y="550" width="400" height="170" rx="8" fill="#7f1d1d" stroke="#dc2626" stroke-width="2" />
    <path d="M 60 580 L 460 580" stroke="#dc2626" stroke-width="1.5" />
    <text x="260.0" y="570" text-anchor="middle" fill="#fee2e2" font-size="13" font-weight="bold">4A. CONCURRENT TRANSFER ALERT</text>
    <text x="74" y="600" fill="#e2e8f0" font-size="11.5">• Status: HIGH RISK DOUBLE-SELLING ALERT</text>
    <text x="74" y="620" fill="#e2e8f0" font-size="11.5">• Intercept: Secondary transaction blocked</text>
    <text x="74" y="640" fill="#e2e8f0" font-size="11.5">• Notification: Alert sent to Buyer 2 and Officer</text>
    <text x="74" y="660" fill="#e2e8f0" font-size="11.5">• Result: Zero duplicate sales executed</text>
  </g>
  <!-- Node: 4B. LOCK ACQUIRED (SECURE) -->
  <g>
    <rect x="500" y="550" width="400" height="170" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="2" />
    <path d="M 500 580 L 900 580" stroke="#16a34a" stroke-width="1.5" />
    <text x="700.0" y="570" text-anchor="middle" fill="#dcfce7" font-size="13" font-weight="bold">4B. LOCK ACQUIRED (SECURE)</text>
    <text x="514" y="600" fill="#e2e8f0" font-size="11.5">• Status: TRANSACTION PROTECTED</text>
    <text x="514" y="620" fill="#e2e8f0" font-size="11.5">• Protection: 45-day mutex lock engaged</text>
    <text x="514" y="640" fill="#e2e8f0" font-size="11.5">• Benefit: Buyer 1 safe during mutation</text>
    <text x="514" y="660" fill="#e2e8f0" font-size="11.5">• Reward: +25 Points to Trust Score</text>
  </g>
</svg>