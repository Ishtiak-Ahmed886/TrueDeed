<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%" style="background:#0f172a; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="20" width="920" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="480" y="50" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="700">5.1 TrueDeed Composite Trust Score — Scoring Architecture</text>
  <text x="480" y="72" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Module 5: Multi-Signal Aggregation, Hard Veto Logic & Audit Certificate Generation</text>
  <line x1="480" y1="230" x2="480" y2="250" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="403.5" y="222.0" width="153" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="480.0" y="235.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Aggregate Signals</text>
  <line x1="480" y1="380" x2="480" y2="400" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="421.5" y="372.0" width="117" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="480.0" y="385.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Classify Risk</text>
  <line x1="480" y1="530" x2="480" y2="550" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="none" />
  <rect x="390.0" y="522.0" width="180" height="18" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="480.0" y="535.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Dispatch Certificate</text>
  <!-- Node: 1. MULTI-SIGNAL ENGINE INGESTION LAYER -->
  <g filter="url(#shadow)">
    <rect x="60" y="110" width="840" height="120" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="2" />
    <path d="M 60 138 L 900 138" stroke="#0d9488" stroke-width="1.5" />
    <text x="480.0" y="129" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="700">1. MULTI-SIGNAL ENGINE INGESTION LAYER</text>
    <text x="74" y="158" fill="#e2e8f0" font-size="11.5" font-weight="500">• Signal 1: Baya DAG Lineage Continuity (Max Weight: 35%)</text>
    <text x="74" y="178" fill="#e2e8f0" font-size="11.5" font-weight="500">• Signal 2: Farayez Inheritance Share Compliance (Max Weight: 25%)</text>
    <text x="74" y="198" fill="#e2e8f0" font-size="11.5" font-weight="500">• Signal 3: Concurrency Plot Lock & Mutation Status (Max Weight: 25%)</text>
    <text x="74" y="218" fill="#e2e8f0" font-size="11.5" font-weight="500">• Signal 4: Registry & NID Identity Consistency (Max Weight: 15%)</text>
  </g>
  <!-- Node: 2. WEIGHTED AGGREGATOR & FAIL-SAFE VETO CORE -->
  <g filter="url(#shadow)">
    <rect x="60" y="250" width="840" height="130" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <path d="M 60 278 L 900 278" stroke="#0284c7" stroke-width="1.5" />
    <text x="480.0" y="269" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="700">2. WEIGHTED AGGREGATOR & FAIL-SAFE VETO CORE</text>
    <text x="74" y="298" fill="#e2e8f0" font-size="11.5" font-weight="500">• Mathematical Aggregation: Base_Score = (S1*0.35) + (S2*0.25) + (S3*0.25) + (S4*0.15)</text>
    <text x="74" y="318" fill="#e2e8f0" font-size="11.5" font-weight="500">• Hard Veto Override: Active Section 144 Court Injunction -> Score forced to < 30% (Critical)</text>
    <text x="74" y="338" fill="#e2e8f0" font-size="11.5" font-weight="500">• Discrepancy Penalty: Minor spelling discrepancy on survey record -> Deduct 10 points</text>
  </g>
  <!-- Node: 3. RISK CLASSIFICATION & RATING BANDS -->
  <g filter="url(#shadow)">
    <rect x="60" y="400" width="840" height="130" rx="8" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <path d="M 60 428 L 900 428" stroke="#9333ea" stroke-width="1.5" />
    <text x="480.0" y="419" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="700">3. RISK CLASSIFICATION & RATING BANDS</text>
    <text x="74" y="448" fill="#e2e8f0" font-size="11.5" font-weight="500">• 🟢 Grade A (90% - 100%): Safe to Buy | 100% Eligible for Bank Mortgage & Collateral</text>
    <text x="74" y="468" fill="#e2e8f0" font-size="11.5" font-weight="500">• 🟡 Grade B (60% - 89%): Cautionary Risk | Mutation pending or minor typographical variance</text>
    <text x="74" y="488" fill="#e2e8f0" font-size="11.5" font-weight="500">• 🔴 Grade C (< 60%): High Fraud Alert | Title defective; conveyance strictly prohibited</text>
  </g>
  <!-- Node: 4. DIGITAL AUDIT CERTIFICATE & QR VERIFICATION DISPATCH -->
  <g filter="url(#shadow)">
    <rect x="60" y="550" width="840" height="170" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="2" />
    <path d="M 60 578 L 900 578" stroke="#16a34a" stroke-width="1.5" />
    <text x="480.0" y="569" text-anchor="middle" fill="#dcfce7" font-size="13" font-weight="700">4. DIGITAL AUDIT CERTIFICATE & QR VERIFICATION DISPATCH</text>
    <text x="74" y="598" fill="#e2e8f0" font-size="11.5" font-weight="500">• Cryptographic Hash: SHA-256 seal embedded into digital verification certificate</text>
    <text x="74" y="618" fill="#e2e8f0" font-size="11.5" font-weight="500">• Offline Verification: Dynamic QR code verifiable by bank loan officers and sub-registrars</text>
    <text x="74" y="638" fill="#e2e8f0" font-size="11.5" font-weight="500">• Standardized Metric: Serves as Bangladesh's first institutional Land Credit Rating</text>
  </g>
</svg>