<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" style="background:#0f172a; font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="20" width="920" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="480" y="50" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">5.1 TrueDeed Composite Trust Score - Scoring Architecture</text>
  <text x="480" y="72" text-anchor="middle" fill="#94a3b8" font-size="12">Module 5: Multi-Signal Aggregation, Hard Veto Logic and Audit Certificate Generation</text>
  <line x1="480" y1="230" x2="480" y2="250" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="403.5" y="222.0" width="153" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="480.0" y="236.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Aggregate Signals</text>
  <line x1="480" y1="380" x2="480" y2="400" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="421.5" y="372.0" width="117" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="480.0" y="386.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Classify Risk</text>
  <line x1="480" y1="530" x2="480" y2="550" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"  />
  <rect x="390.0" y="522.0" width="180" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="480.0" y="536.0" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">Dispatch Certificate</text>
  <!-- Node: 1. MULTI-SIGNAL ENGINE INGESTION LAYER -->
  <g>
    <rect x="60" y="110" width="840" height="120" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="2" />
    <path d="M 60 140 L 900 140" stroke="#0d9488" stroke-width="1.5" />
    <text x="480.0" y="130" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="bold">1. MULTI-SIGNAL ENGINE INGESTION LAYER</text>
    <text x="74" y="160" fill="#e2e8f0" font-size="11.5">• Signal 1: Baya DAG Lineage Continuity (Max Weight: 35%)</text>
    <text x="74" y="180" fill="#e2e8f0" font-size="11.5">• Signal 2: Farayez Inheritance Share Compliance (Max Weight: 25%)</text>
    <text x="74" y="200" fill="#e2e8f0" font-size="11.5">• Signal 3: Concurrency Plot Lock and Mutation Status (Max Weight: 25%)</text>
    <text x="74" y="220" fill="#e2e8f0" font-size="11.5">• Signal 4: Registry and NID Identity Consistency (Max Weight: 15%)</text>
  </g>
  <!-- Node: 2. WEIGHTED AGGREGATOR AND FAIL-SAFE VETO CORE -->
  <g>
    <rect x="60" y="250" width="840" height="130" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <path d="M 60 280 L 900 280" stroke="#0284c7" stroke-width="1.5" />
    <text x="480.0" y="270" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="bold">2. WEIGHTED AGGREGATOR AND FAIL-SAFE VETO CORE</text>
    <text x="74" y="300" fill="#e2e8f0" font-size="11.5">• Mathematical Aggregation: Base_Score = (S1*0.35) + (S2*0.25) + (S3*0.25) + (S4*0.15)</text>
    <text x="74" y="320" fill="#e2e8f0" font-size="11.5">• Hard Veto Override: Active Section 144 Court Injunction -&gt; Score forced to &lt; 30% (Critical)</text>
    <text x="74" y="340" fill="#e2e8f0" font-size="11.5">• Discrepancy Penalty: Minor spelling discrepancy on survey record -&gt; Deduct 10 points</text>
  </g>
  <!-- Node: 3. RISK CLASSIFICATION AND RATING BANDS -->
  <g>
    <rect x="60" y="400" width="840" height="130" rx="8" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <path d="M 60 430 L 900 430" stroke="#9333ea" stroke-width="1.5" />
    <text x="480.0" y="420" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="bold">3. RISK CLASSIFICATION AND RATING BANDS</text>
    <text x="74" y="450" fill="#e2e8f0" font-size="11.5">• Grade A (90% - 100%): Safe to Buy | 100% Eligible for Bank Mortgage and Collateral</text>
    <text x="74" y="470" fill="#e2e8f0" font-size="11.5">• Grade B (60% - 89%): Cautionary Risk | Mutation pending or minor typographical variance</text>
    <text x="74" y="490" fill="#e2e8f0" font-size="11.5">• Grade C (&lt; 60%): High Fraud Alert | Title defective; conveyance strictly prohibited</text>
  </g>
  <!-- Node: 4. DIGITAL AUDIT CERTIFICATE AND QR VERIFICATION DISPATCH -->
  <g>
    <rect x="60" y="550" width="840" height="170" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="2" />
    <path d="M 60 580 L 900 580" stroke="#16a34a" stroke-width="1.5" />
    <text x="480.0" y="570" text-anchor="middle" fill="#dcfce7" font-size="13" font-weight="bold">4. DIGITAL AUDIT CERTIFICATE AND QR VERIFICATION DISPATCH</text>
    <text x="74" y="600" fill="#e2e8f0" font-size="11.5">• Cryptographic Hash: SHA-256 seal embedded into digital verification certificate</text>
    <text x="74" y="620" fill="#e2e8f0" font-size="11.5">• Offline Verification: Dynamic QR code verifiable by bank loan officers and sub-registrars</text>
    <text x="74" y="640" fill="#e2e8f0" font-size="11.5">• Standardized Metric: Serves as Bangladesh&#x27;s first institutional Land Credit Rating</text>
  </g>
</svg>